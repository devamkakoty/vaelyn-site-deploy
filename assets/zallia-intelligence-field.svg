<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1160" role="img" aria-labelledby="title desc">
  <title id="title">Zallia physical intelligence field</title>
  <desc id="desc">An abstract textile form connected to identity, care, custody and readiness evidence points.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141714"/>
      <stop offset=".58" stop-color="#0b0e0c"/>
      <stop offset="1" stop-color="#17140f"/>
    </linearGradient>
    <linearGradient id="silk" x1=".15" y1=".05" x2=".86" y2=".94">
      <stop offset="0" stop-color="#f2eee4" stop-opacity=".94"/>
      <stop offset=".25" stop-color="#a99f8c" stop-opacity=".56"/>
      <stop offset=".52" stop-color="#312f2a" stop-opacity=".18"/>
      <stop offset=".74" stop-color="#d9cfbd" stop-opacity=".48"/>
      <stop offset="1" stop-color="#6d675b" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="silkEdge" x1=".04" y1=".28" x2=".94" y2=".74">
      <stop offset="0" stop-color="#f6f1e8" stop-opacity=".68"/>
      <stop offset=".48" stop-color="#b59561" stop-opacity=".18"/>
      <stop offset="1" stop-color="#f6f1e8" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#c9a567" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#8f7041" stop-opacity=".07"/>
      <stop offset="1" stop-color="#8f7041" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur24">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000" flood-opacity=".52"/>
    </filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded">
        <feFuncA type="table" tableValues="0 .035"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="soft-light"/>
    </filter>
    <clipPath id="clothClip">
      <path d="M318 188C389 126 510 104 607 151C700 196 727 302 695 397C669 472 615 526 622 606C628 677 694 747 666 837C631 949 499 1020 390 972C286 927 226 809 254 702C277 615 330 558 306 466C283 377 235 259 318 188Z"/>
    </clipPath>
  </defs>

  <rect width="960" height="1160" rx="34" fill="url(#background)"/>
  <ellipse cx="504" cy="548" rx="390" ry="430" fill="url(#halo)" filter="url(#blur24)"/>

  <g opacity=".44" fill="none" stroke="#d3c7b1">
    <ellipse cx="490" cy="546" rx="354" ry="422" stroke-opacity=".14"/>
    <ellipse cx="490" cy="546" rx="282" ry="346" stroke-opacity=".11"/>
    <ellipse cx="490" cy="546" rx="212" ry="270" stroke-opacity=".09"/>
  </g>

  <g filter="url(#softShadow)">
    <path d="M318 188C389 126 510 104 607 151C700 196 727 302 695 397C669 472 615 526 622 606C628 677 694 747 666 837C631 949 499 1020 390 972C286 927 226 809 254 702C277 615 330 558 306 466C283 377 235 259 318 188Z" fill="url(#silk)" stroke="url(#silkEdge)" stroke-width="2"/>
    <g clip-path="url(#clothClip)" fill="none">
      <path d="M268 235C388 272 424 405 366 530C307 657 330 825 442 1000" stroke="#f8f4eb" stroke-opacity=".3" stroke-width="3"/>
      <path d="M337 148C446 272 487 399 425 538C367 668 393 839 518 997" stroke="#080b09" stroke-opacity=".5" stroke-width="16"/>
      <path d="M421 125C520 266 552 393 491 530C433 663 467 825 590 957" stroke="#f7f0e2" stroke-opacity=".22" stroke-width="5"/>
      <path d="M531 128C604 252 635 374 567 517C509 641 545 775 675 874" stroke="#080b09" stroke-opacity=".42" stroke-width="20"/>
      <path d="M622 166C678 296 669 405 616 506C555 622 601 706 680 784" stroke="#f7f0e2" stroke-opacity=".18" stroke-width="6"/>
      <path d="M245 406C373 370 506 399 699 489" stroke="#efe6d5" stroke-opacity=".12" stroke-width="4"/>
      <path d="M238 650C391 585 550 608 694 704" stroke="#efe6d5" stroke-opacity=".11" stroke-width="4"/>
    </g>
  </g>

  <g fill="none" stroke="#c5a16a" stroke-width="1.4">
    <path d="M119 329C195 329 238 350 297 402"/>
    <path d="M667 281C762 250 826 267 875 326"/>
    <path d="M676 744C772 772 821 830 851 906"/>
    <path d="M149 846C228 821 269 784 303 716"/>
  </g>
  <g fill="#c5a16a">
    <circle cx="119" cy="329" r="5"/>
    <circle cx="297" cy="402" r="5"/>
    <circle cx="667" cy="281" r="5"/>
    <circle cx="875" cy="326" r="5"/>
    <circle cx="676" cy="744" r="5"/>
    <circle cx="851" cy="906" r="5"/>
    <circle cx="149" cy="846" r="5"/>
    <circle cx="303" cy="716" r="5"/>
  </g>

  <g fill="#ece5d7" font-family="Arial, sans-serif" font-size="16" letter-spacing="3.2">
    <text x="78" y="304">IDENTITY</text>
    <text x="748" y="244">CARE</text>
    <text x="745" y="948">READINESS</text>
    <text x="76" y="891">CUSTODY</text>
  </g>

  <g transform="translate(673 462)">
    <rect width="196" height="118" rx="14" fill="#f4efe5" fill-opacity=".93"/>
    <circle cx="28" cy="29" r="6" fill="#7e976e"/>
    <rect x="48" y="24" width="97" height="8" rx="4" fill="#232720" fill-opacity=".78"/>
    <rect x="22" y="59" width="148" height="1" fill="#292c27" fill-opacity=".16"/>
    <rect x="22" y="78" width="112" height="7" rx="3.5" fill="#292c27" fill-opacity=".42"/>
    <rect x="22" y="94" width="78" height="6" rx="3" fill="#292c27" fill-opacity=".2"/>
  </g>

  <g transform="translate(83 529)">
    <rect width="214" height="132" rx="14" fill="#171a17" fill-opacity=".88" stroke="#f1e9db" stroke-opacity=".18"/>
    <rect x="21" y="23" width="70" height="7" rx="3.5" fill="#c5a16a"/>
    <rect x="21" y="49" width="156" height="1" fill="#f1e9db" fill-opacity=".15"/>
    <circle cx="28" cy="77" r="5" fill="#c5a16a"/>
    <rect x="45" y="73" width="123" height="7" rx="3.5" fill="#f1e9db" fill-opacity=".55"/>
    <circle cx="28" cy="103" r="5" fill="#6f8068"/>
    <rect x="45" y="99" width="91" height="7" rx="3.5" fill="#f1e9db" fill-opacity=".3"/>
  </g>

  <rect x="1" y="1" width="958" height="1158" rx="33" fill="none" stroke="#f0e8d9" stroke-opacity=".1" stroke-width="2"/>
  <rect width="960" height="1160" rx="34" fill="transparent" filter="url(#grain)"/>
</svg>
